app-id: com.xnview.XnViewMP
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: xnview
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # Audio access
  - --socket=pulseaudio
  # Filesystem access
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=xdg-config/kdeglobals:ro
  # OpenGL access
  - --device=dri
  # See: https://github.com/flathub/com.xnview.XnViewMP/issues/83
  - --env=QT_QPA_PLATFORMTHEME=gtk3
cleanup:
  - /share/man
  - /XnView/XnView.desktop*
tags:
  - proprietary
modules:
  - name: kerberos
    subdir: src
    config-opts:
      - --disable-static
      - --disable-rpath
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /sbin
      - /share/et
      - /share/examples
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
        x-checker-data:
          type: anitya
          project-id: 13287
          stable-only: true
          url-template: https://kerberos.org/dist/krb5/${version0}.${version1}/krb5-${version0}.${version1}.${version2}.tar.gz
  - name: XnViewMP
    buildsystem: simple
    build-commands:
      - |
        find "XnView" -xtype f -executable \( -iname '*.jpg' -o -iname '*.png' -o -iname '*.txt' -o -iname '*.zip' \) -exec chmod -x {} +;
        cp -a "XnView" "${FLATPAK_DEST}/";
        mkdir "${FLATPAK_DEST}/bin";
        ln -s "${FLATPAK_DEST}/XnView/xnview.sh" "${FLATPAK_DEST}/bin/xnview";
      - ln -s /usr/lib/x86_64-linux-gnu/libbz2.so.1.0.8 "${FLATPAK_DEST}/XnView/lib/libbz2.so.1.0";
      - install -Dm644 com.xnview.XnViewMP.metainfo.xml -t ${FLATPAK_DEST}/share/appdata/
      - install -Dm644 com.xnview.XnViewMP.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -d /app/share/icons
      - for icon_size in 16 22 24 32 36 48 64 72 96 128 192 256 512; do install -Dm644
        icons/hicolor/${icon_size}x${icon_size}/apps/com.xnview.XnViewMP.png ${FLATPAK_DEST}/share/icons/hicolor/${icon_size}x${icon_size}/apps/com.xnview.XnViewMP.png;
        done
    sources:
      - type: archive
        url: https://download.xnview.com/versions/XnView_MP/XnView_MP-1.11.7-linux-x64.tgz
        sha256: 8a2f3f50986acae25f6b517829327c81de4005fc0487c139a08c163ebbe094ca
        strip-components: 0
        x-checker-data:
          type: html
          url: https://www.xnview.com/update.txt
          version-pattern: \[XnViewMP\]\s*version=([\d.]+)
          url-template: https://download.xnview.com/versions/XnView_MP/XnView_MP-$version-linux-x64.tgz
      # Icons, desktop file and metainfo
      - type: archive
        path: icons.tgz
      - type: file
        path: com.xnview.XnViewMP.metainfo.xml
      - type: file
        path: com.xnview.XnViewMP.desktop
